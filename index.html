  <div class="card"><div class="tbl"><table><thead><tr><th>Source</th><th>Status</th><th>Extracted</th><th>Limitations</th></tr></thead><tbody>
  <tr><td><b>A. GAA Six-Month Off-Season Master Template</b> (11 pp)</td><td>${pill('Read in full','good')}</td><td class="small">Six phases + progression criteria; default week; training principles; strength library; example lower session; power framework; return-to-speed stages; conditioning tables; mobility; nutrition pyramid; KW targets; baseline/retest table; recovery; injury guardrails; log template; execution checklist; coaching rules.</td><td class="small">Itself says exact Paudie and full McGurn prescriptions were not available to it; its sets/reps are "integrated template", not source prescriptions.</td></tr>
  <tr><td><b>B. Championship Gym Session Log</b> (Excel)</td><td>${pill('Read — template only','warn')}</td><td class="small">2 sheets. Session Log: 22 exercises across movement prep, athletic primer, upper-body strength, rehab/maintenance, abs finisher + post-session review fields. Quick Log: empty grid.</td><td class="small"><b>No loads, reps, dates or RPE are filled in.</b> No historical training can be imported from it. Recorded as missing, not estimated.</td></tr>
  <tr><td><b>4-Week Progressive Overload Tracker</b> (PDF, 3 sessions)</td><td>${pill('Read — 1 week of data','good')}</td><td class="small">Sessions 1–3 with sets × reps, cues, warm-ups, progression rule. Handwritten Session 2, Week 1: med-ball rotational 6 kg × 5; overhead med-ball 6 kg × 5; barbell bench 60 kg × 8, 6, 6, 6; wide-grip pull-up 6, 6, 4 (no load); DB seated shoulder press 15 kg × 12, 12, 12; DB incline row 25 kg × 12, 9, 6.</td><td class="small">No date recorded. DB loads assumed per dumbbell (flagged). Preacher curl, triceps and lateral raise not recorded.</td></tr>
  <tr><td><b>Tuesday — Fresh & Fast</b> (photo)</td><td>${pill('Read','good')}</td><td class="small">Championship-week gym + primer: all exercises, sets × reps, notes, targets. Handwritten next to DB Bench Press: "30 × 5" and "6".</td><td class="small">No date. Read as 30 kg dumbbells, two sets of 5 and 6 — ambiguous (could be 30 kg total, or one set of 5 then 6 reps). Flagged on the record.</td></tr>
  <tr><td><b>D. Off-Feet Conditioning</b> (McGurn / The365Athlete PDF)</td><td>${pill('Read in full','good')}</td><td class="small">Aerobic base steady state + Aerobic Sessions 1–3; Anaerobic Sessions 1–6 with original wording.</td><td class="small">Session 3 "3 sets" scope ambiguous; Session 4 final block has no rep count.</td></tr>
  <tr><td><b>C. Monday Performance Dashboard</b> (HTML)</td><td>${pill('Not uploaded','bad')}</td><td class="small">—</td><td class="small">Not in this upload, so I couldn't inspect or retain its features. Re-upload to merge anything useful.</td></tr>
  <tr><td><b>E. Kevin Walsh / 100% PT screenshots</b></td><td>${pill('Not uploaded','bad')}</td><td class="small">The 8 primary benchmarks come from your brief and the master template §12 (they agree).</td><td class="small">The 14 bonus standards could not be extracted — placeholders only.</td></tr>
  <tr><td><b>F. Paudie in-season screenshots</b></td><td>${pill('Not uploaded','bad')}</td><td class="small">Exercise names and block structure from your brief (Movement Prep B, Strength Block 1, Circuit Block 2, Cool-down).</td><td class="small">Sets, reps and instructions not visible to me — marked "Not available" rather than guessed.</td></tr>
  </tbody></table></div></div>
  <div class="card"><h2>Conflicts & flags</h2><ul class="small">
   <li><b>Bench press:</b> your brief says the latest is 60 kg × 6; the tracker shows 60 kg × 8, 6, 6, 6. The tracker values are used (best set 60 × 8 → Epley e1RM 76 kg).</li>
   <li><b>Pull-ups:</b> your brief says bodyweight 5 / 5 / 4; the tracker shows 6, 6, 4. Tracker values are used; there may be a later session you haven't uploaded — add it in the Gym log.</li>
   <li><b>DB loads:</b> 15 kg shoulder press, 25 kg row and 30 kg DB bench are assumed per dumbbell. Change "Load means" on the record if not.</li>
   <li><b>Benchmark loading conventions</b> (bench/DB press, walking lunge, BSS) are ambiguous in the source — set them on the Benchmarks page.</li>
   <li><b>Phase sets/reps, skill and tactical emphasis</b> per phase are template synthesis, tagged as such.</li>
   <li><b>Programme start date</b> isn't in any source — set it in Profile.</li></ul></div>`;

const STR_CAT=/strength|posterior|unilateral|calf|arms|shoulders/i;
function rangeStart(){const w=cur.anRange??8;return w?addDays(todayISO(),-7*w):'0000-00-00'}
const inR=d=>d&&d>=rangeStart()&&d<=todayISO();
const rangeLabel=()=>({4:'4 weeks',8:'8 weeks',12:'12 weeks',0:'entire history'})[cur.anRange??8];
function liftNames(){const m=new Map();S.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{if((e.sets||[]).some(x=>num(x.reps)!=null)&&(STR_CAT.test(e.cat||libFind(e.name)?.cat||'')||BENCH.some(b=>b.lifts.map(norm).includes(norm(e.name)))))m.set(e.name,(m.get(e.name)||0)+1)}));return[...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
const benchFor=n=>BENCH.find(b=>b.lifts.map(norm).includes(norm(n)));
function liftStats(n){const all=exHistory(n).filter(x=>DONE.includes(x.s.status));const rows=all.filter(x=>inR(x.s.date)).map(x=>{const ss=(x.e.sets||[]).filter(s=>num(s.reps)!=null);const b=bestSet(x.e);
   return{d:x.s.date,top:Math.max(0,...ss.map(s=>num(s.w)||0)),e1:b?.v??null,sets:ss.length,reps:sum(ss.map(s=>num(s.reps))),rpe:avg(ss.map(s=>num(s.rpe)))??num(x.s.rpe),lt:x.e.lt}});
  const pbAll=Math.max(0,...all.map(x=>bestSet(x.e)?.v||0))||null;const undated=all.filter(x=>!x.s.date).length;const weeks=(cur.anRange??8)||Math.max(1,rows.length?Math.ceil(daysBetween(rows[0].d,todayISO())/7):1);
  const first=rows.find(r=>r.e1),last=[...rows].reverse().find(r=>r.e1);const b=benchFor(n);
  return{n,rows,pbAll,undated,freq:rows.length/weeks,change:first&&last&&first!==last?r1(last.e1-first.e1):null,last,b}}

VIEWS.analytics=()=>{const tab=cur.anTab||'strength';const rg=cur.anRange??8;
  const tabs=[['strength','Strength'],['body','Body composition'],['cond','Conditioning'],['pillars','Four pillars']];
  let body='';
  if(tab==='strength'){const names=liftNames();const sel=cur.anLift&&names.includes(cur.anLift)?cur.anLift:names[0];const st=names.map(liftStats);
    body=names.length?`<div class="card"><div class="tbl"><table><thead><tr><th>Lift</th><th class="num">Sessions</th><th class="num">Per week</th><th class="num">Top set</th><th class="num">Latest e1RM</th><th class="num">Change</th><th class="num">PB (e1RM)</th><th>Kevin Walsh</th></tr></thead><tbody>
     ${st.map(x=>{const bs=x.b?benchStatus(x.b):null;return`<tr class="click" data-a="anlift" data-n="${esc(x.n)}"><td><b>${esc(x.n)}</b>${x.undated?` <span class="small muted">+${x.undated} undated</span>`:''}</td><td class="num">${x.rows.length}</td><td class="num">${x.rows.length?r1(x.freq):'–'}</td><td class="num">${x.rows.length?Math.max(...x.rows.map(r=>r.top))+(x.rows[0]?.lt==='per_hand'?'/h':''):'–'}</td><td class="num">${x.last?.e1??'–'}</td><td class="num">${x.change!=null?(x.change>0?'+':'')+x.change:'–'}</td><td class="num">${x.pbAll??'–'}</td><td class="small">${bs?`${bs.pct!=null?bs.pct+'% ':''}${readyChip(benchReadiness(bs))}`:'—'}</td></tr>`}).join('')}</tbody></table></div>
     <span class="small muted">Range: ${rangeLabel()}. e1RM = estimated 1RM (Epley, sets of 1–10 reps). Tested results are plotted separately. Undated historical records appear only in "entire history" PBs.</span></div>
     <div class="card"><div class="card-h"><h2>${esc(sel)}</h2><select data-c="anliftsel" style="width:auto">${opt(names,sel)}</select></div>
      <div class="grid g2"><div><h3>Load & estimated 1RM</h3><div class="chartbox"><canvas id="anL"></canvas></div></div><div><h3>Sets & reps per session</h3><div class="chartbox"><canvas id="anV"></canvas></div></div>
      <div><h3>Effort (RPE)</h3><div class="chartbox sm"><canvas id="anR"></canvas></div></div><div><h3>Frequency (sessions per week)</h3><div class="chartbox sm"><canvas id="anF"></canvas></div></div></div></div>`:empty('No loaded strength sets logged yet. Log a gym session and this fills in.')}
  else if(tab==='body'){const tc=trendClass();body=`<div class="tiles"><div class="tile"><span class="k">7-day average</span><span class="v num">${bodyweightNow().kg} kg</span><span class="s">${bodyweightNow().src}</span></div><div class="tile"><span class="k">Weekly change</span><span class="v num">${tc.delta!=null?(tc.delta>0?'+':'')+tc.delta:'–'}</span><span class="s">${esc(tc.label)}</span></div><div class="tile"><span class="k">Weigh-ins (range)</span><span class="v num">${S.bodyweight.filter(b=>inR(b.date)).length}</span></div></div>
    <div class="card"><h3>Daily weigh-ins and 7-day rolling average</h3><div class="chartbox"><canvas id="anBW"></canvas></div><span class="small muted">Read the line, not the dots. Daily swings of 0.5–1 kg are mostly water and food.</span></div>
    <div class="grid g2"><div class="card"><h3>Weekly change in 7-day average</h3><div class="chartbox sm"><canvas id="anBWc"></canvas></div></div><div class="card"><h3>Waist & body-fat estimate</h3><div class="chartbox sm"><canvas id="anWa"></canvas></div><span class="small muted">Body-fat estimates are imprecise; trends only.</span></div></div>`}
  else if(tab==='cond'){body=`<div class="card"><h3>Weekly minutes — easy vs hard vs football</h3><div class="chartbox"><canvas id="anC1"></canvas></div></div>
    <div class="grid g2"><div class="card"><h3>Sessions per week</h3><div class="chartbox sm"><canvas id="anC2"></canvas></div><span class="small muted">Football = logged field sessions, matches and pitch conditioning.</span></div><div class="card"><h3>Session duration & average HR</h3><div class="chartbox sm"><canvas id="anC3"></canvas></div><span class="small muted">Lower average HR at the same easy effort over time suggests a better aerobic base (only if machine and effort are comparable).</span></div></div>`}
  else{body=`<div class="card"><h3>Weekly engagement by pillar</h3><div class="chartbox"><canvas id="anP1"></canvas></div><span class="small muted">Counts of completed, logged entries. This is engagement — it is not improvement.</span></div>
    <div class="card"><h3>Improvement indicators (only where measured)</h3>${improvementTable()}</div>
    <div class="card"><h3>Monthly engagement</h3>${monthlyPillars()}</div>`}
  return`${head('Review','Analytics','Are you actually improving? Each view separates what was measured from what was merely done.')}
  <div class="row between"><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${tab===k?'on':''}" data-a="set" data-k="anTab" data-v="${k}">${l}</button>`).join('')}</div>
   <div class="seg">${[[4,'4 wk'],[8,'8 wk'],[12,'12 wk'],[0,'All']].map(([v,l])=>`<button class="${rg===v?'on':''}" data-a="setrange" data-v="${v}">${l}</button>`).join('')}</div></div>${body}`};
A.goto=(el,d)=>{if(d.k)cur[d.k]=d.v;location.hash=d.to};
A.setrange=(el,d)=>{cur.anRange=+d.v;render()};A.anlift=(el,d)=>{cur.anLift=d.n;render();setTimeout(()=>document.getElementById('anL')?.scrollIntoView({behavior:'smooth',block:'center'}),50)};A.anliftsel=el=>{cur.anLift=el.value;render()};
function weeksInRange(){const w=(cur.anRange??8)||Math.max(4,Math.ceil(daysBetween(histStart()||todayISO(),todayISO())/7)+1);const ws=weekStart(todayISO());return Array.from({length:Math.min(w,52)},(_,i)=>addDays(ws,-7*(Math.min(w,52)-1-i)))}
function improvementTable(){const d=todayISO();const rows=[];
  const tests=skillTests().filter(t=>t.pts.length>1);rows.push(['Skills',tests.length?tests.map(t=>`${esc(t.name)}: ${t.pts[0].p}% → ${t.pts[t.pts.length-1].p}%`).join('<br>'):'No repeated technical tests yet — practice volume alone is not shown as improvement.']);
  const m28=S.matches.filter(m=>m.date&&daysBetween(m.date,d)<=28);rows.push(['Tactical',m28.length?`${m28.filter(m=>S.tactical.some(t=>t.matchId===m.id)).length}/${m28.length} recent matches reviewed; ${S.tactical.filter(t=>t.date&&daysBetween(t.date,d)<=28&&t.improve).length} improvement points recorded`:'No matches logged in 28 days.']);
  const a=S.mental.filter(m=>m.date&&daysBetween(m.date,d)<28),b=S.mental.filter(m=>m.date&&daysBetween(m.date,d)>=28&&daysBetween(m.date,d)<56);const x=avg(a.map(m=>num(m.m2))),y=avg(b.map(m=>num(m.m2)));
  rows.push(['Mental',x!=null&&y!=null?`Composure self-rating ${r1(y)} → ${r1(x)} (4-week averages)`:'Not enough self-ratings to compare two 4-week blocks.']);

function pillarWeek(ws){const we=addDays(ws,6),inW=x=>inRange(x.date,ws,we);return{sc:S.sessions.filter(x=>inW(x)&&DONE.includes(x.status)).length+S.conditioning.filter(x=>inW(x)&&DONE.includes(x.status||'completed')).length,tac:S.tactical.filter(inW).length,sk:S.skills.filter(inW).length,me:S.mental.filter(inW).length}}
function monthlyPillars(){const d=todayISO();const months=[0,1,2].map(i=>{const x=parseD(d);return new Date(x.getFullYear(),x.getMonth()-i,1)}).reverse();
  return`<div class="tbl"><table><thead><tr><th>Month</th><th class="num">S&C sessions</th><th class="num">Tactical</th><th class="num">Skills</th><th class="num">Mental</th></tr></thead><tbody>${months.map(m=>{const a=iso(m),b=iso(new Date(m.getFullYear(),m.getMonth()+1,0));const inM=x=>inRange(x.date,a,b);

    chart('anF',{type:'bar',data:{labels:wks.map(w=>w.slice(5)),datasets:[barDs('Sessions',wks.map(w=>r.filter(z=>inRange(z.d,w,addDays(w,6))).length),2)]}})}
  if(tab==='body'){const rw=rolling7().filter(z=>inR(z.date));chart('anBW',{type:'line',zero:false,data:{labels:rw.map(z=>z.date),datasets:[line('Daily',rw.map(z=>z.kg),2,{showLine:false,pointRadius:3}),line('7-day avg',rw.map(z=>z.avg),0,{pointRadius:0,borderWidth:3})]}});
    const wa=wks.map(w=>avg(S.bodyweight.filter(b=>inRange(b.date,w,addDays(w,6))).map(b=>num(b.kg))));chart('anBWc',{type:'bar',zero:true,data:{labels:wks.map(w=>w.slice(5)),datasets:[barDs('Change kg',wa.map((v,i)=>i&&v!=null&&wa[i-1]!=null?r1(v-wa[i-1]):null))]}});
    const bw=sorted('bodyweight').filter(b=>inR(b.date)&&(num(b.waist)||num(b.bf)));chart('anWa',{type:'line',zero:false,data:{labels:bw.map(b=>b.date),datasets:[line('Waist cm',bw.map(b=>num(b.waist))),line('Body fat % (est.)',bw.map(b=>num(b.bf)),1,{yAxisID:'y2'})]},options:{scales:{y2:{position:'right'}}}})}
  if(tab==='cond'){const m=(w,k)=>sum(S.conditioning.filter(c=>c.kind===k&&inRange(c.date,w,addDays(w,6))&&DONE.includes(c.status||'completed')).map(c=>num(c.duration)));
    const fieldN=w=>S.events.filter(e=>['gaa','soccer'].includes(e.type)&&DONE.includes(e.status)&&inRange(e.date,w,addDays(w,6))).length+S.matches.filter(x=>inRange(x.date,w,addDays(w,6))).length+S.conditioning.filter(c=>c.kind==='football'&&inRange(c.date,w,addDays(w,6))).length;
    chart('anC1',{type:'bar',data:{labels:wks.map(w=>w.slice(5)),datasets:[barDs('Easy aerobic',wks.map(w=>m(w,'easy')),0,{stack:'a'}),barDs('Hard',wks.map(w=>m(w,'hard')),1,{stack:'a'}),barDs('Football',wks.map(w=>m(w,'football')),2,{stack:'a'})]},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
    const cnt=(w,k)=>S.conditioning.filter(c=>c.kind===k&&inRange(c.date,w,addDays(w,6))&&DONE.includes(c.status||'completed')).length;
    chart('anC2',{type:'bar',data:{labels:wks.map(w=>w.slice(5)),datasets:[barDs('Easy',wks.map(w=>cnt(w,'easy'))),barDs('Hard',wks.map(w=>cnt(w,'hard')),1),barDs('Football',wks.map(fieldN),2)]}});
    const cs=sorted('conditioning').filter(c=>inR(c.date)&&DONE.includes(c.status||'completed'));chart('anC3',{type:'line',zero:false,data:{labels:cs.map(c=>c.date),datasets:[line('Duration min',cs.map(c=>num(c.duration))),line('Avg HR',cs.map(c=>num(c.avgHR)),1,{yAxisID:'y2'})]},options:{scales:{y2:{position:'right'}}}})}
  if(tab==='pillars'){const pw=wks.map(pillarWeek);chart('anP1',{type:'bar',data:{labels:wks.map(w=>w.slice(5)),datasets:[barDs('S&C',pw.map(x=>x.sc)),barDs('Tactical',pw.map(x=>x.tac),2),barDs('Skills',pw.map(x=>x.sk),1),barDs('Mental',pw.map(x=>x.me),3)]}})}};

// ---------- Pillar hub ----------
VIEWS.pillars=()=>{const d=todayISO(),wk=weekStats(weekStart(d));const p4=[0,1,2,3].map(i=>pillarWeek(addDays(weekStart(d),-7*i)));const t4=k=>sum(p4.map(x=>x[k]));
  const ins=coachInsights(d);const nx=p=>ins.find(r=>r.pillar===p);const benches=BENCH.map(benchStatus).map(benchReadiness);const tests=skillTests();
  const card=(href,title,eng,eng4,imp,next)=>`<a class="card pcard" href="#${href}"><div class="card-h"><h2>${title}</h2><span class="btn sm">Open</span></div><div class="row" style="align-items:baseline"><span class="big num">${eng}</span><span class="small muted">this week · ${eng4} in 4 weeks</span></div><div class="small"><b>Improvement:</b> ${imp}</div>${next?`<div class="small muted"><b>Next:</b> ${esc(next.action)}</div>`:''}</a>`;
  return`${head('Four pillars','Development hub',esc(PHILOSOPHY.pillars))}
  <div class="grid g2">
   ${card('sc','Strength & conditioning',wk.gymDone+wk.easyN+wk.hardN,t4('sc'),`${benches.filter(b=>b.l>=2).length}/8 benchmarks approaching or achieved; ${e1Trend(28).filter(t=>t.up).length} lifts up in 4 weeks`,nx('S&C'))}
   ${card('tactical','Tactical awareness',wk.tactical,t4('tac'),(()=>{const m=S.matches.filter(x=>x.date&&daysBetween(x.date,d)<=28);return m.length?`${m.filter(x=>S.tactical.some(t=>t.matchId===x.id)).length}/${m.length} recent matches reviewed`:'No recent matches logged'})(),nx('Tactical'))}
   ${card('skills','Skills',wk.skills,t4('sk'),tests.filter(t=>t.pts.length>1).length?tests.filter(t=>t.pts.length>1).map(t=>`${esc(t.name)} ${t.pts[0].p}%→${t.pts[t.pts.length-1].p}%`).slice(0,2).join('; '):'No repeated technical tests yet',nx('Skills'))}
   ${card('mental','Mental toughness',wk.mental,t4('me'),(()=>{const a=S.mental.filter(m=>m.date&&daysBetween(m.date,d)<28&&m.positive);return a.length?`Positive after mistakes in ${Math.round(a.filter(m=>m.positive==='yes').length/a.length*100)}% of logged sessions`:'Not enough entries'})(),nx('Mental'))}
  </div>
  <div class="note info small">Engagement counts logged, completed entries. Improvement is shown only where something was measured (tests, e1RM, review coverage, self-ratings). Doing more sessions is not counted as getting better.</div>
  <div class="card"><div class="card-h"><h3>Engagement — last 8 weeks</h3><button class="btn sm" data-a="goto" data-to="analytics" data-k="anTab" data-v="pillars">Full analytics</button></div><div class="chartbox"><canvas id="hubCh"></canvas></div></div>`};
AFTER.pillars=()=>{const ws=weekStart(todayISO());const w=Array.from({length:8},(_,i)=>addDays(ws,-7*(7-i)));const pw=w.map(pillarWeek);
  chart('hubCh',{type:'bar',data:{labels:w.map(x=>x.slice(5)),datasets:[barDs('S&C',pw.map(x=>x.sc)),barDs('Tactical',pw.map(x=>x.tac),2),barDs('Skills',pw.map(x=>x.sk),1),barDs('Mental',pw.map(x=>x.me),3)]}})};

// ---------- Strength & conditioning pillar ----------
VIEWS.sc=()=>{const d=todayISO(),P=S.profile,wk=weekStats(weekStart(d));const all=BENCH.map(benchStatus);const pb=pbs().slice(0,6);const c=P.clearance;
  return`${head('Pillar 1','Strength & conditioning','Physical preparation and athletic progression — the foundation the other pillars are expressed through.',`<button class="btn pri" data-a="newsession">Log gym</button><button class="btn" data-a="add" data-col="conditioning">Log conditioning</button>`)}
  <div class="tiles"><div class="tile"><span class="k">Gym this week</span><span class="v num">${wk.gymDone}/${P.gymTarget}</span></div><div class="tile"><span class="k">Aerobic this week</span><span class="v num">${wk.easyMin} min</span><span class="s">${wk.easyN}/${P.aerobicTarget} sessions</span></div><div class="tile"><span class="k">Hard conditioning</span><span class="v num">${wk.hardN}</span><span class="s">max 1 when load allows</span></div><div class="tile"><span class="k">Football exposures</span><span class="v num">${wk.field+wk.matches}</span></div></div>
  <div class="card"><div class="card-h"><h3>Kevin Walsh benchmark readiness</h3><a class="btn sm" href="#benchmarks">Details</a></div><div class="tbl"><table><tbody>${all.map(x=>`<tr><td>${esc(x.b.name)}</td><td class="num">${x.b.type==='external'?'+':''}${x.target} kg</td><td class="num">${x.pct!=null?x.pct+'%':'–'}</td><td>${readyChip(benchReadiness(x))}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g2"><div class="card"><div class="card-h"><h3>Best lifts (estimated)</h3><a class="btn sm" href="#analytics">Analytics</a></div>${pb.length?`<div class="tbl"><table><tbody>${pb.map(p=>`<tr class="click" data-a="openhist" data-n="${esc(p.name)}"><td>${esc(p.name)}</td><td class="num">${p.w}${p.lt==='per_hand'?'/h':''} × ${p.r}</td><td class="num">${p.v} e1RM</td></tr>`).join('')}</tbody></table></div>`:empty('No loaded sets yet.')}</div>
   <div class="card"><h3>Physical restrictions</h3><div class="row">${RESTRICTIONS.map(([k,l])=>pill(l+': '+(c[k]==='cleared'?'cleared':'restricted'),c[k]==='cleared'?'good':'bad')).join('')}</div><span class="small muted">Set on the Injury page after clinician clearance only.</span>
    <h3>Speed & power</h3><span class="small">${S.tests.length} test result(s) logged. <a href="#speed">Open</a></span></div></div>
  <div class="card"><h3>Gym and aerobic sessions — last 8 weeks</h3><div class="chartbox"><canvas id="scCh"></canvas></div></div>`};
AFTER.sc=()=>{const ws=weekStart(todayISO());const w=Array.from({length:8},(_,i)=>addDays(ws,-7*(7-i)));const s=w.map(weekStats);
  chart('scCh',{type:'bar',data:{labels:w.map(x=>x.slice(5)),datasets:[barDs('Gym',s.map(x=>x.gymDone)),barDs('Easy aerobic',s.map(x=>x.easyN),2),barDs('Hard',s.map(x=>x.hardN),1),barDs('Football',s.map(x=>x.field+x.matches),3)]}})};

// ===================== boot =====================
applyTheme();go();initStore();
</script>

</body></html>
